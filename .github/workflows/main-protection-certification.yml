name: Main Protection Certification

# P0-06 — re-reads the LIVE branch protection on this repository's `main` and fails if it has
# drifted from what docs/security/p0-06-main-protection.certified.json certifies.
#
# WHY THIS WORKFLOW EXISTS HERE RATHER THAN IN THE ERP REPOSITORY
#
# The Bizosto certification covers two repositories. The other half runs in
# lacreativodesign/nextjs-boilerplate and certifies only itself (`--repo=erp`).
#
# It cannot certify this one. This repository is PRIVATE, and a job token issued to the ERP
# repository has no access to it — GitHub answers 404. A cross-repository read that fails must
# never be reported as a successful certification, so rather than hand one repository a
# credential for the other, each verifies ITSELF under its own automatic job token. Neither can
# vouch for the other, and neither needs to.
#
# WHY THE TOKEN MATTERS, BEYOND RATE LIMITS
#
# `GET /repos/{owner}/{repo}/rulesets/{id}` returns `bypass_actors` only to callers with
# sufficient access to the ruleset. A single bypass actor makes every other rule advisory, so
# that field decides whether the protection is real — and an unprivileged read can come back
# WITHOUT it. Absent is not empty. The verifier therefore refuses to certify the control from
# an unprivileged read instead of defaulting it to "none"; an earlier version of the ERP
# verifier defaulted it, and independent review correctly rejected that as a false green.
#
# WHAT IT WILL REPORT UNTIL THE OWNER ACTS
#
# Two things are outstanding and this job says so rather than passing quietly:
#
#   1. This repository must be PRIVATE. Publishing proprietary source to obtain a branch
#      protection setting is not a remedy — it is a larger exposure than the control it buys.
#      A public reading fails as `repository.visibility`.
#   2. GitHub Free serves rulesets on public repositories only. Protecting a PRIVATE
#      repository needs GitHub Pro or higher. Until the plan is upgraded and the ruleset
#      created, this job fails with `ruleset.applied`, which is the honest reading of an open
#      P0-06 gap. It gates nothing: this is not a required check.
#
# No personal access token is stored or required.

on:
  schedule:
    # 07:00 UTC daily — noon in Asia/Karachi, so drift introduced overnight is reported before
    # the working day rather than at the next merge.
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    # Only when the certification itself changes: re-reading GitHub on every unrelated merge
    # spends rate limit to re-prove something that cannot have changed.
    paths:
      - 'docs/security/p0-06-main-protection.certified.json'
      - 'scripts/verify-github-main-protection.mjs'
      - '.github/workflows/main-protection-certification.yml'

permissions:
  contents: read

jobs:
  main-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: the verifier is dependency-free on purpose, so the control that proves
      # `main` is protected cannot be broken by an unrelated dependency problem.
      - name: Verify live main protection (P0-06)
        run: node scripts/verify-github-main-protection.mjs --repo=website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
